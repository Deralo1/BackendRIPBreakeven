<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Главная - Налоги</title>
    <link rel="stylesheet" href="/static/styles/mainpageNalogi_style.css">
    <!-- В будущем: заменить локальные src изображений на ссылки MinIO -->
</head>
<body>
<div class="page-root">
    <header class="topbar">
        <div class="logo-wrap">
            <a href="/Nalogimain">
                <img src="http://localhost:9000/lab1/fns.svg.png" alt="logo" class="logo-img">
            </a>
            <div class="service-title">ФЕДЕРАЛЬНАЯ<br>НАЛОГОВАЯ СЛУЖБА</div>
        </div>
    </header>

    <main class="content">
        <div class="cards-area">
            <div class="search-row">
                <form class="search-form" action="/Nalogimain" method="GET">
                    <input class="search-input" type="text" name="query" placeholder="Поиск" value="{{ .query }}">
                    <button class="search-button" type="submit">Найти</button>
                </form>
            </div>
            <section class="cards-grid">
    {{ if .orders }}
        {{ range .orders }}
        <div class="card">
            <div class="card-img" style="background-image: url('{{ .ImageURL }}');"></div>
            <div class="card-body">
                <h3 class="card-title">{{ .Title }}</h3>
                <p class="card-sub">{{ .ShortDescription }}</p>
                
                <!-- Новый блок с ценой -->
                <p class="card-price">Цена: {{ .Price }} ₽</p>
                
                <div class="card-controls">
                    <a class="btn-details" href="/CostCard/{{ .ID }}">Подробнее</a>
                </div>
            </div>
        </div>
        {{ end }}
    {{ else }}
        <div class="no-results">Ничего не найдено.</div>
    {{ end }}
</section>

    </main>

    <!-- Калькулятор: ведёт на страницу breakevencalc -->
    <a class="calculator" href="/breakevencalc">
        <img src="http://localhost:9000/lab1/korzinafull.png" alt="calculator">
        <span class="calc-badge">2</span>
    </a>

</div>
</body>
</html>
